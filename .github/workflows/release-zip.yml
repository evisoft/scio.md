name: release-zip
# The three zips (the plugin for claude.ai and Cowork, the skill alone for the Claude API, the OpenAI portal's) are built and attached by
# scripts/release.sh. Once a release is published, this job rebuilds them from the tag and compares each with the
# attached asset entry by entry (name, mode, CRC-32): what people
# upload is what the tag holds. Read-only — it never changes the release; a mismatch is a red run to act on.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to check, e.g. v0.11.0"
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild the zips from the tag
        run: python3 scripts/build-zip.py --out "$RUNNER_TEMP/rebuilt"
      - name: Download the attached zips
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'scio-*.zip' --dir "$RUNNER_TEMP/released"
      - name: Same entries, same modes, same contents
        run: |
          python3 - "$RUNNER_TEMP/rebuilt" "$RUNNER_TEMP/released" <<'EOF'
          import glob, sys, zipfile
          def archives(folder):
              found = {p.rsplit("/", 1)[1]: p for p in glob.glob(f"{folder}/scio-*.zip")}
              assert len(found) == 3, f"{folder}: expected the plugin, skill and OpenAI zips, found {sorted(found)}"
              return found
          def entries(path):
              with zipfile.ZipFile(path) as z:
                  return {i.filename: (i.CRC, i.file_size, i.external_attr >> 16) for i in z.infolist()}
          rebuilt, released = archives(sys.argv[1]), archives(sys.argv[2])
          assert sorted(rebuilt) == sorted(released), f"assets are {sorted(released)}, the tag builds {sorted(rebuilt)}"
          for name in sorted(rebuilt):
              a, b = entries(rebuilt[name]), entries(released[name])
              diff = sorted(k for k in a.keys() | b.keys() if a.get(k) != b.get(k))
              assert not diff, f"{name}: {len(diff)} entries differ: {diff[:10]}"
              print(f"{name}: {len(b)} entries match the tag")
          EOF
