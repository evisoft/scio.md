name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # the deployed contract and rules change between pull requests too: a daily run is where drift shows up first
  schedule:
    - cron: "17 6 * * *"
# this job installs third-party packages (pip, npm, npx) and needs nothing but the checkout: say so here rather than rely on
# the repository's default token permissions (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python and JSON parse
        run: |
          python3 -m py_compile $(git ls-files '*.py')
          python3 - <<'EOF'
          import json, glob, re
          for f in glob.glob("**/*.json", recursive=True, include_hidden=True):   # .claude-plugin/, .cursor-plugin/, .mcp.json, .devcontainer/ too
              try:
                  json.load(open(f))
              except ValueError:
                  if not f.startswith(".devcontainer/"):   # devcontainer.json is JSONC by convention; everything else is strict JSON
                      raise
                  json.loads(re.sub(r"^\s*//.*$", "", open(f).read(), flags=re.M))
          for f in glob.glob("**/*.jsonc", recursive=True, include_hidden=True):
              json.loads(re.sub(r"^\s*//.*$", "", open(f).read(), flags=re.M))
          print("json ok")
          EOF
      - name: Security suite (red-team fixtures, guards, bridge, trust gate, endpoint pinning)
        run: pip install cryptography >/dev/null && python3 tests/test-security.py
      - name: Extraction suite (fetch.py boilerplate stripping, the ordering fix, byte-accurate truncation)
        run: python3 tests/test-extraction.py
      - name: Onboarding suite (session brief and reminders, the server's instants, the unattended watch)
        run: python3 tests/test-onboarding.py
      - name: Manifests equal what git ships (the skill, and what the harness loads from the plugin root)
        run: |
          python3 scripts/gen-manifest.py --check
          ! grep -E 'redteam|test-security|gen-manifest|__pycache__|\.pyc|\.scio/' skills/scio/MANIFEST.sha256 PLUGIN.sha256
      - name: Bundled rules match the live signed rules
        run: python3 skills/scio/scripts/refresh-rules.py --check
      - name: Claude Code plugin validation
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version
          claude plugin validate .
      - name: Agent Skills validation
        run: npx -y skills-ref validate skills/scio
  # The oldest Python the runtime scripts support. The instants the server writes (a trimmed fraction, `Z`) are what
  # 3.10's datetime.fromisoformat refuses and 3.12's accepts: the regression tests for them can fail only here.
  python-3-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Every suite on Python 3.10
        run: pip install cryptography >/dev/null && python3 tests/test-security.py
  # The three copies of the tool contract the plugin carries (tools.md, server/tools.json, the stand-in's snapshot)
  # against the contract scio.md serves. Drift is a release to cut, not a fault in the pull request that happens to
  # run when the platform deploys: reported here and on the daily run, never blocking.
  contract-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bundled contract copies match the deployed contract (https://scio.md/v1/tools.json)
        run: python3 scripts/sync-contract.py --check
