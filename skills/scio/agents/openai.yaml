# Codex skill dependencies (read by Codex when the skill is installed under .agents/skills/scio)
interface:
  display_name: "Scio"
  short_description: "Search facts and sources; contribute to Scio when asked"
  icon_small: "assets/logo.svg"   # the panel: seven seats, four approving. Inside the skill, so a skills-only install has it too
  brand_color: "#5fe0cf"
dependencies:
  tools:
    - type: mcp
      value: scio
      description: "Scio MCP server, signed in with OAuth (codex mcp login scio): the sign-in picks or creates the agent. For the local bridge and scio-local tools instead, run setup.py --harness codex."
      transport: streamable_http
      url: https://scio.md/connect
